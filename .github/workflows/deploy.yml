name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: [self-hosted, reardon]
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Tag current image for rollback
        run: |
          set -uo pipefail
          if docker image inspect reardonsystems:latest >/dev/null 2>&1; then
            docker tag reardonsystems:latest reardonsystems:previous
            echo "Tagged current reardonsystems:latest as reardonsystems:previous"
          else
            echo "No existing image to tag"
          fi

      - name: Build and load runtime image
        run: |
          set -euo pipefail
          # PUBLIC_* values are inlined into the client bundle at build time and
          # are not secrets (they ship to browsers). They are read from the
          # site's public env file on the runner host if present.
          PUBENV=/opt/hosting/sites/reardonsystems/.env
          if [ -f "$PUBENV" ]; then
            set -a; . "$PUBENV"; set +a
            echo "Loaded public build config from $PUBENV"
          else
            echo "::warning::No $PUBENV; PUBLIC_* build args will be empty"
          fi
          ARGS=""
          for v in PUBLIC_SPECOPS_BETA PUBLIC_STRIPE_PRICING_TABLE_ID PUBLIC_STRIPE_PUBLISHABLE_KEY; do
            val="${!v:-}"
            [ -n "$val" ] && ARGS="$ARGS --build-arg $v=$val"
          done
          # shellcheck disable=SC2086
          docker build -f Dockerfile.runtime $ARGS -t reardonsystems:latest .
          docker image inspect reardonsystems:latest --format 'image built: {{.Id}}'

      - name: Restart container
        run: |
          set -euo pipefail
          SITE=/opt/hosting/sites/reardonsystems
          mkdir -p "$SITE/data"
          # Runtime secrets come from Vault (source of truth), materialized by
          # the runner into a 600 env file. Fails the deploy if Vault is sealed
          # or login fails, rather than shipping checkout that silently errors.
          "$SITE/fetch-runtime-secrets.sh"
          docker rm -f reardonsystems >/dev/null 2>&1 || true
          docker run -d --name reardonsystems --restart unless-stopped -p 8085:4321 \
            -v "$SITE/data:/app/.data" \
            --env-file "$SITE/.env.runtime" \
            reardonsystems:latest >/dev/null
          sleep 5
          docker ps --filter name=reardonsystems --format '{{.Names}} {{.Status}}'

      - name: Verify
        run: |
          set -euo pipefail
          fail=0
          for path in / /engagements/ /company/ /blog/ /contact/ /products/specops/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8085$path" || echo fail)
            echo "  $path -> $code"
            [ "$code" = "200" ] || fail=1
          done
          # Runtime secrets must be present in the container environment.
          for v in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET; do
            if docker exec reardonsystems sh -c "[ -n \"\$$v\" ]"; then
              echo "  $v -> present"
            else
              echo "::error::$v missing from container env"; fail=1
            fi
          done
          # API route through the edge proxy (the real path). Probing :8085
          # directly bypasses the proxy's X-Forwarded-* headers, so the CSRF
          # origin check correctly rejects it.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Host: reardonsystems.com' -H 'Origin: https://reardonsystems.com' \
            -X POST -F 'name=deploy-probe' -F 'email=deploy-probe@reardonsystems.com' \
            http://127.0.0.1/api/waitlist || echo fail)
          echo "  POST /api/waitlist (via fafo-nginx) -> $code"
          case "$code" in 303|200) : ;; *) fail=1 ;; esac
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: reardonsystems.com' http://127.0.0.1/ || echo fail)
          echo "  via fafo-nginx -> $code"
          [ "$code" = "200" ] || fail=1
          if [ "$fail" = "1" ]; then
            echo "::error::Deployment verification failed"
            exit 1
          fi
          git rev-parse --short HEAD > /opt/hosting/sites/reardonsystems/.deployed-commit
          echo "Deployed ${GITHUB_SHA::7} successfully"

      - name: Roll back on failure
        if: failure()
        run: |
          set -uo pipefail
          if docker image inspect reardonsystems:previous >/dev/null 2>&1; then
            docker rm -f reardonsystems >/dev/null 2>&1 || true
            docker run -d --name reardonsystems --restart unless-stopped -p 8085:4321 \
              -v /opt/hosting/sites/reardonsystems/data:/app/.data \
              --env-file /opt/hosting/sites/reardonsystems/.env.runtime \
              reardonsystems:previous >/dev/null
            echo "Rolled back to reardonsystems:previous"
          fi
