<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1F44"/>
      <stop offset="100%" stop-color="#071733"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- Accent circle -->
  <circle cx="1050" cy="120" r="220" fill="#1E6BFF" fill-opacity="0.18"/>
  <circle cx="1050" cy="120" r="220" fill="none"/>
  <!-- Logo mark: replace with your SVG logo. This is a placeholder wordmark. -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="16" height="16" rx="2" fill="#1E6BFF"/>
    <text x="32" y="14" font-family="Inter, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">Reardon Systems</text>
  </g>
  <!-- Eyebrow label -->
  <text x="80" y="290" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#1E6BFF" letter-spacing="3">MID-MARKET CLOUD ECONOMICS</text>
  <!-- Headline: 2 lines, ~72px -->
  <text x="80" y="370" font-family="Inter, sans-serif" font-size="72" font-weight="900" fill="#FFFFFF" letter-spacing="-2">
    Your cloud bill
  </text>
  <text x="80" y="450" font-family="Inter, sans-serif" font-size="72" font-weight="900" fill="#FFFFFF" letter-spacing="-2">
    is a design flaw.
  </text>
  <!-- Subhead -->
  <text x="80" y="520" font-family="Inter, sans-serif" font-size="24" font-weight="500" fill="#FFFFFF" fill-opacity="0.75">
    Modern private/hybrid cloud. Adult economics.
  </text>
  <!-- Bottom accent bar -->
  <rect x="80" y="570" width="64" height="4" fill="#FF6B35"/>
</svg>
