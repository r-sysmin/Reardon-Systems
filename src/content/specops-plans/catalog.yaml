- id: pro
  order: 1
  tier: 1
  name: Pro
  stripe:
    productId: prod_VLUHrhtTr1T9j5
    productName: Pro
    description: >-
      All-in-one for solo inspectors: offline field app, unlimited reports,
      scheduling, CRM, payments, plus website with domain, hosting, and SSL.
      One bill. No stack tax. No per-report fees.
    statementDescriptor: Spec Ops T1 Pro
  currency: usd
  prices:
    month:
      amount: 9900
      display: "$99/mo"
      priceId: price_1UKnJ8FMdvDS1y792Z9wbh22
    year:
      amount: 99000
      display: "$990/yr"
      priceId: price_1UKnJ9FMdvDS1y79Cc055IFD
  seats: "1 inspector"
  target: "Single-operator firms that need everything without team management."
  trialDays: 30
  checkout: payment_element
  includes:
    - 1 inspector seat
    - Unlimited inspections and reports
    - Mobile + desktop app with full offline mode and auto-sync
    - Full reporting suite — PDF and interactive client portal
    - Digital pre-inspection agreements with e-signatures
    - Scheduling and calendar
    - Client and agent CRM
    - Automated email and SMS notifications
    - Integrated payment collection (Stripe, PayPal, Square)
    - Professional website included — template site, domain, hosting, SSL, maintenance
    - Online booking widget
    - Email support (24-hour response)
    - 30-day free trial
