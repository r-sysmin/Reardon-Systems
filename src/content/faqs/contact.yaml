page: contact
items:
  - q: How fast do you reply?
    a: Within one business day. Usually same day.
  - q: Do I need a bill to reach out?
    a: >
      No. Most conversations start with a question, not a spreadsheet. Bring the
      bill when you're ready.
  - q: Will I talk to a salesperson?
    a: >
      No. The person who replies is the person who'd scope and run the
      engagement.
  - q: Do you work with companies outside the mid-market?
    a: >
      We work with teams that have real hyperscaler spend — usually
      $500K–$10M+ annually. Below that, we're usually not the right fit. Above
      it, you probably have a platform team that does this already.
