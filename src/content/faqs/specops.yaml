page: specops
items:
  - q: What software does SpecOps replace?
    a: >
      It's designed to replace your report-writing workflow end to end —
      capture, photos, findings, and the finished client-ready report. If you're
      on a 90s-era desktop program or a generic form builder, you'll see the
      difference on your first inspection.
  - q: Can I import my existing templates and checklists?
    a: >
      Yes. Upload a template and a finished report from your current software
      during the waitlist signup, and we'll prepare your setup before onboarding
      starts. If you don't have them handy, we can pull them together during
      onboarding.
  - q: Does it work on my phone or tablet?
    a: >
      Yes. It's built for field use on the device you already carry.
      Offline-first, so it keeps working with no signal.
  - q: What does it cost?
    a: >
      Pricing is set with the cohort. Early cohort members get founder pricing
      locked for the life of the account. Join the waitlist and we'll walk you
      through it when we reach out.
  - q: When does Cohort 2 open?
    a: >
      We're onboarding Cohort 1 now. Cohort 2 opens when every Cohort 1
      inspector is live and supported. Join the waitlist and you'll be first in
      line.
  - q: Is my data private?
    a: >
      Yes. Files you upload for setup stay private and are used only to prepare
      your account. Inspection data belongs to you.
